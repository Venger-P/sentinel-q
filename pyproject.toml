[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-q"
version = "0.1.0"
description = "Model-free adversarial detection with attack type profiling"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Sentinel-Q contributors"}]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.0"]
server = ["fastapi>=0.100", "uvicorn>=0.20", "requests>=2.28"]
full = ["scikit-learn>=1.0", "torch>=2.0", "torchvision>=0.15",
        "matplotlib>=3.5", "fastapi>=0.100", "uvicorn>=0.20",
        "requests>=2.28"]
dev = ["pytest>=7.0", "httpx>=0.24"]

[project.scripts]
sentinel-q = "sentinel_q.cli:main"
sentinel-q-serve = "sentinel_q.cli:serve_entry"

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinel_q*"]